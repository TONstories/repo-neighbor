<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" role="img"><title>Reserve one issue, prepare a patch, then request maintainer review</title><rect width="1000" height="150" rx="12" fill="#faf4e6"/>
<text x="34" y="57" font-family="Menlo,monospace" font-size="17" font-weight="600" fill="#34605b">COMMUNITY BOARD</text>
<text x="34" y="106" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#183639">Reserve an issue</text>
<text x="366" y="57" font-family="Menlo,monospace" font-size="17" font-weight="600" fill="#34605b">YOUR AGENT</text>
<text x="366" y="106" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#183639">Prepare a patch</text>
<text x="696" y="57" font-family="Menlo,monospace" font-size="17" font-weight="600" fill="#34605b">MAINTAINER</text>
<text x="696" y="106" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#183639">Review the PR</text>
<polyline points="280,81 329,81 320,72" fill="none" stroke="#b36c42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="329,81 320,90" fill="none" stroke="#b36c42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="606,81 655,81 646,72" fill="none" stroke="#b36c42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="655,81 646,90" fill="none" stroke="#b36c42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>