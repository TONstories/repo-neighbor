name: Projects of the week
on:
  schedule:
    - cron: '15 6 * * 1'
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['campaigns/editor.json', 'campaigns/costs.json', 'campaigns/local-work.json']
  issues:
    types: [opened]
concurrency:
  group: repo-neighbor-campaign
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  reconcile:
    if: github.repository == 'TONstories/repo-neighbor' && (github.event_name != 'issues' || startsWith(github.event.issue.title, 'qfg ') || startsWith(github.event.issue.title, 'rn '))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Test state transitions
        run: python3 -m unittest discover -s tests
      - name: Refresh all pending requests and publish boards
        env:
          RN_IMPORT_MOBILE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 campaign/run.py
          git add campaigns
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh weekly projects and reservation ledger'
            git push origin HEAD:main
          fi
          python3 campaign/receipts.py
